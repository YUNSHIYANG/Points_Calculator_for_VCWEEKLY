[version]
version = 1

[formatters]
[formatters.standard]
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[formatters.detailed]
format = "%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(lineno)d - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[handlers]
[handlers.console]
class = "logging.StreamHandler"
level = "INFO"
formatter = "standard"
stream = "ext://sys.stdout"

[handlers.file]
class = "logging.handlers.RotatingFileHandler"
level = "DEBUG"
formatter = "detailed"
filename = "logs/app.log"
maxBytes = 10485760  # 10MB
backupCount = 5
encoding = "utf-8"

[loggers]
[loggers.root]
level = "INFO"
handlers = ["console", "file"]

[loggers.weekly_score]
level = "DEBUG"
handlers = ["console", "file"]
propagate = false

[loggers.weekly_score.core]
level = "DEBUG"
handlers = ["console", "file"]
propagate = false

[loggers.weekly_score.gui]
level = "INFO"
handlers = ["console", "file"]
propagate = false