[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-score-calculator"
version = "3.0.0"
description = "基于Bilibili视频数据的周刊得点计算工具"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
requires-python = ">=3.10"
authors = [
    {name = "云师阳", email = "1866643210@qq.com"}
]
keywords = ["bilibili", "weekly-score", "calculator", "vcweekly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.4.0",
    "PyQt6-Fluent-Widgets>=1.4.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/yunshiyang/Points_Calculator_for_VCWEEKLY"
Repository = "https://github.com/yunshiyang/Points_Calculator_for_VCWEEKLY"
Issues = "https://github.com/yunshiyang/Points_Calculator_for_VCWEEKLY/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.0.0",
    "pyinstaller>=5.0.0",
]

[project.scripts]
weekly-score = "weekly_score.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
known_first_party = ["weekly_score"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"